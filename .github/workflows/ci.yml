name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA, never by tag.
      - name: checkout (full history for gitleaks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt lists files that need formatting:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: no file under cmd/ or internal/ needs formatting"

      - name: vet
        run: go vet ./...

      - name: tests with the race detector
        run: go test -race ./... -count=1

      - name: fuzzing (bounded, seeds plus 30s per target)
        run: ./scripts/fuzz.sh 30s

      - name: govulncheck
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$RUNNER_TEMP/tools/govulncheck" ./...

      - name: gitleaks (tree and history)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tgz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

      - name: reproducible release build
        run: ./scripts/release.sh

      - name: gate demonstration (r6 fails, r7 passes, deliveries verify)
        run: ./scripts/gate-demo.sh

      - name: upload checksum and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-${{ github.sha }}
          path: |
            dist/*.sha256
            dist/xammu-*
          if-no-files-found: error
          retention-days: 14

  # The laboratory is the only proof that the compose file reproduces the
  # documented behaviours. It runs on a Docker-enabled runner because a compose
  # file alone is never accepted as evidence: ./lab/verify.sh asserts all 134
  # checks and tears the lab down. DIGESTS.txt is uploaded, never committed:
  # it describes one build on one runner, not the repository.
  lab:
    name: lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: build the laboratory images
        run: ./lab/build.sh

      - name: laboratory self-test (134 checks)
        run: ./lab/verify.sh 2>&1 | tee lab/verify.log

      - name: tear the laboratory down
        if: always()
        run: ./lab/teardown.sh

      - name: upload laboratory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-${{ github.sha }}
          path: |
            lab/DIGESTS.txt
            lab/verify.log
          if-no-files-found: warn
          retention-days: 14

  # Go 1.27.3 is verified on Ubuntu with the race detector, fuzzing and gitleaks.
  # This matrix says nothing about those; it only answers whether gofmt, vet and
  # the suite hold on the two systems the project has never run the suite on.
  # macOS has never been exercised, so a failure here is a real finding, not noise.
  test-other-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt lists files that need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: tests
        run: go test ./... -count=1

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    # A signed release waits for the laboratory: the release notes claim 134/134,
    # so the job that produces the signature must not run before that is true.
    needs: [verify, lab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: tag must match ToolVersion
        run: |
          version=$(sed -n 's/^const ToolVersion = "xammu-\([^"]*\)"$/\1/p' internal/integrity/manifest.go)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "cannot read ToolVersion from internal/integrity/manifest.go"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "tag v${tag} does not match ToolVersion ${version}"
            exit 1
          fi
          echo "release version: ${version}"

      - name: reproducible release build
        run: ./scripts/release.sh

      - name: install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: SBOM with Syft (CycloneDX JSON)
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: dist
          format: cyclonedx-json
          output-file: dist/xammu-sbom.cdx.json
          syft-version: v1.56.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: sign binary, checksum and SBOM (keyless)
        run: |
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          version=$(sed -n 's/^const ToolVersion = "xammu-\([^"]*\)"$/\1/p' internal/integrity/manifest.go)
          binary="dist/xammu-${version}-${goos}-${goarch}"
          for artifact in "$binary" "${binary}.sha256" "dist/xammu-sbom.cdx.json"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: verify the signatures just produced
        run: |
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          version=$(sed -n 's/^const ToolVersion = "xammu-\([^"]*\)"$/\1/p' internal/integrity/manifest.go)
          binary="dist/xammu-${version}-${goos}-${goarch}"
          for artifact in "$binary" "${binary}.sha256" "dist/xammu-sbom.cdx.json"; do
            cosign verify-blob --bundle "${artifact}.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/ci\\.yml@refs/tags/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
          done

      - name: upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xammu-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # The artifact survives above even if publication fails, so a failed
      # Release never leaves the signed evidence stranded on the runner.
      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "XAMMU $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,assets
