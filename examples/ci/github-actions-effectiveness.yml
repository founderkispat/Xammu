# Example consumer workflow: run the effectiveness gate over a sealed bundle and
# publish its SARIF to GitHub Code Scanning.
#
# Copy this file to .github/workflows/ in the repository that holds the sealed
# runs. It is a demonstration of the contract, not part of XAMMU's own CI: the
# bundle named below is the reference run committed in this repository.
#
# Exit codes are the interface: 0 every applicable check passed, 1 a check failed
# (a result about the target), 2 the gate could not evaluate its inputs. The job
# keeps the SARIF even when the gate exits 1, then fails, so the finding is
# visible in Code Scanning and the pipeline still stops.
name: waf-effectiveness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA, never by tag.
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: build
        run: go build -o build/xammu ./cmd/xammu

      # Verifying first keeps the evidence question separate from the policy
      # question: a bundle that does not verify is exit 2, not a finding.
      - name: verify the sealed bundle and its delivery
        run: |
          ./build/xammu verify \
            --store runs/waf-effectiveness-2026-11-05-r7 \
            --rederive \
            --trust-key trust/waf-effectiveness.pub
          ./build/xammu verify \
            --publication publications/waf-effectiveness-2026-11-05-r7 \
            --trust-key trust/waf-effectiveness.pub

      - name: evaluate the policy
        id: gate
        continue-on-error: true
        run: |
          ./build/xammu gate \
            --store runs/waf-effectiveness-2026-11-05-r7 \
            --policy policies/effectiveness-reference.yaml \
            --format sarif \
            --out build/gate

      - name: upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('build/gate/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: build/gate/results.sarif
          category: xammu-waf-effectiveness

      - name: keep the machine document for the record
        if: always() && hashFiles('build/gate/results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xammu-gate-${{ github.run_id }}
          path: build/gate/results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: fail the job when the policy failed
        if: steps.gate.outcome == 'failure'
        run: |
          echo "the gate did not meet the policy; the SARIF results name the failed check"
          exit 1
